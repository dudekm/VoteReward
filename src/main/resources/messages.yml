#
# Reward players for voting for the server.
#
# Source code and documentation: https://github.com/dudekm/VoteReward
#
# Colours: & codes (&a green, &c red, &e yellow, &l bold…). An empty message ('') is not sent.

reward-received: '&aThanks for voting on &e%server_name%&a! Your reward has been given.'

command:
  usage: '&cUsage: /votereward [reward|check [player]|reload|poll]'
  no-permission: '&cYou don''t have permission to use this command.'
  only-player: '&cOnly a player can use this command.'
  reward:
    none: '&cNo rewards are waiting for you. Votes are checked every &e%interval%&c — if you have just voted, try again in a moment.'
  check:
    no-player: '&cGive a player name: /votereward check <player>'
    header: '&aVotes of &e%player_name% &atoday:'
    rewarded: '&a- &e%server_name%&a: reward received.'
    pending: '&e- %server_name%: reward waiting — use /votereward.'
    not-voted: '&c- &e%server_name%&c: no vote yet.'
  reload:
    done: '&aConfiguration reloaded. Checking votes every &e%interval%&a.'
    failed: '&cCould not reload the configuration — see the console. The previous one stays active.'
  poll:
    started: '&aChecking the vote lists...'
    done: '&aChecked &e%checked%&a list(s) (&e%failed%&a failed), read &e%votes%&a vote(s), &e%rewards%&a new reward(s).'

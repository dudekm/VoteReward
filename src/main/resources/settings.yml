#
# Reward players for voting for the server.
#
# Source code and documentation: https://github.com/dudekm/VoteReward
#

polling:
  # How often every list below is checked for new votes: 30s, 1m, 5m…
  # Each check asks only for votes since the previous one. Minimum: 10s.
  interval: 30s

# The lists your server is on. The names (lista-minecraft…) are up to you, but must be unique.
#   address          - the list's website
#   uuid             - your server's ID on that list (last part of your server's page address)
#   reward-commands  - console commands run for each vote. Placeholders:
#                      %player_name%, %player_display_name%, %player_uuid%,
#                      %server_name%, %server_address%
# A player is rewarded at most once a day (UTC) per list. Players who are offline
# when their vote is found get the reward the next time they join.
servers:
  lista-minecraft:
    address: https://lista-minecraft.pl
    uuid: 183413bc-4588-4265-8f06-346963e5d7df
    reward-commands:
      - xp add %player_name% 100
      - give %player_name% diamond
  lista-serwerow-emecz:
    address: https://lista-serwerow.emecz.pl
    uuid: 264acafc-136c-4def-a363-088587c7a405
    reward-commands: []
  minecraft-list:
    address: https://minecraft-list.info
    uuid: d6dfe480-da3a-495a-a92d-5a198a7f2f83
    reward-commands: []
